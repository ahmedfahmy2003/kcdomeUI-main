@if(lcount() !== 0){
    <div class="kc-dropdown">
        <div class="kc-dropdown-toggle" (click)="toggle()">
            <span class="user-toggle bg-success">
                <span class="user-name text-white p-1">Reports generated, click here</span>
            </span>
        </div>
        @if(isOpen()){
            <div class="kc-dropdown-menu dropdown-menu-lg dropdown-menu-end dropdown-menu-s1">
                                    
                                                <div class="dropdown-body">
                                                    <div class="nk-notification">
                                                    @for (items of rlist(); track items; let i = $index){
                                                        <div class="nk-notification-item dropdown-inner">
                                                        
                                                        <div class="nk-notification-content cursor-pointer flex-grow-1" (click)="openMenu(items)">
                                                            <div class="nk-notification-text"><strong>{{items.mname}}: {{items.rid}}</strong></div>
                                                        </div>
                                                        </div>
                                                    }
                                                    </div><!-- .nk-notification -->
                                                </div>
            </div>
        }
    </div>
}
